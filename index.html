<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TigerTokyo2026</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
      color: #1f2933;
    }

    main {
      width: min(90vw, 720px);
      padding: 3rem;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.15);
      text-align: center;
    }

    h1 {
      margin: 0 0 1rem;
      font-size: clamp(2.5rem, 6vw, 4rem);
      letter-spacing: 0.04em;
    }

    p {
      margin: 0 auto 1rem;
      max-width: 34rem;
      line-height: 1.7;
      font-size: 1.05rem;
    }

    .tag {
      display: inline-block;
      margin-bottom: 1rem;
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      background: #fff2e8;
      color: #c2410c;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="tag">靜態網頁</div>
      <h1>TigerTokyo2026</h1>
    </header>
    <p>歡迎來到 TigerTokyo2026 靜態展示頁面。</p>
    <p>此頁面使用純 HTML 與內嵌 CSS 製作，可直接部署為靜態網站，無需額外建置流程。</p>
  </main>
</body>
</html>
